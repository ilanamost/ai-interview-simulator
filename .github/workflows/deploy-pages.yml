name: Deploy web/ to GitHub Pages

# Frontend-only: GitHub Pages serves static files, so this builds and
# publishes web/ alone. api/ has no deployment target here — see
# .doc/deployment.md for self-hosting it and pointing this build at it via
# VITE_API_BASE_URL.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Matches GitHub's own Pages template: let an in-flight deployment finish
  # publishing rather than cancelling it mid-way:
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `web/.env.production` is gitignored (see .doc/deployment.md), so
      # nothing in the checkout sets these — they come from this repo's own
      # Settings -> Secrets and variables -> Actions -> Variables instead.
      # Unset, both fall back to web/src/config/env.ts's defaults (mock
      # mode, no API base URL): a safe, working demo build rather than a
      # broken one, for as long as no api/ host has been configured here.
      # Once one exists, set both repository variables and this build picks
      # them up on the next run with no workflow change.
      - name: Build
        working-directory: web
        env:
          VITE_INTERVIEW_SOURCE: ${{ vars.VITE_INTERVIEW_SOURCE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
